services:
  api:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3002}:3002"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3002
      MONGODB_URI: mongodb://wedding:${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD}@mongo:27017/wedding?authSource=wedding
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS to your HTTPS invitation origin}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set a random ADMIN_TOKEN}
      RATE_LIMIT_SECRET: ${RATE_LIMIT_SECRET:?Set a random RATE_LIMIT_SECRET}
      RSVP_ENABLED: ${RSVP_ENABLED:-true}
      WEDDING_EVENT_IDS: ${WEDDING_EVENT_IDS:-reception,wedding}
      TRUST_PROXY: ${TRUST_PROXY:-}
    depends_on:
      mongo:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: wedding
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD}
    volumes:
      - wedding_mongo:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/01-wedding-user.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
volumes:
  wedding_mongo:
